name: Package integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check bundled workflows and resources
        run: python3 validate-build.py
      - name: Build and inspect the portable archive
        run: python3 build-release.py
